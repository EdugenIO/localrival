name: Verify application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:render
      - run: npm run build
      - run: node scripts/build-pages.mjs
      - run: npm run security:audit -- --production
      - run: npm run security:audit
      - run: node node_modules/drizzle-kit/bin.cjs export --config=drizzle.config.ts
